# ─── Citation-Link Integrity Check (Warn-First) ───
# What:  Fires on every push to main. Runs Test-CitationLinkIntegrity (t/3598) over the summaries
#        ↔ taxonomy citation graph. This is the CI-wiring half (t/3745) of the advisory gate the
#        Computational Linguist owns; mirrors bdi-boundary-check.yml (the established push-time
#        data-integrity precedent in this repo).
#
# SCOPE — a+c ONLY, for now (t/3745#3/#4):
#   leg-a (summary→node link resolution) and leg-c (source_index staleness) read THIS repo only
#     (+ the public AITriad module) — no token needed.
#   leg-b (source resolution) needs the PRIVATE ai-triad-sources repo (3.4 GB), which requires a
#     token this repo does not carry. Until DATA_REPO_TOKEN is provisioned here, leg-b is skipped
#     via -SkipSourceResolution (reports `skipped`, never false-fails). When the token lands, drop
#     the switch and add a sparse `*/metadata.json` checkout of ai-triad-sources to light up leg-b.
#
# LEG-A IS A FAILING CHECK (t/4042, SO e/266#2): a leg-a (link-resolution) offender turns the run RED
#   and opens/updates the leg-a issue. Data is direct-commit, so this DETECTS a bad push loudly — it
#   cannot prevent one (surviving vector: a pre-commit hook on the writers would). Legs b and c stay
#   ADVISORY: they never fail the run. A non-pending leg-c red opens its OWN advisory issue (distinct
#   title) so index staleness keeps a durable signal without being promoted. The workflow `name:` keeps
#   its "(Warn-First)" suffix deliberately — renaming would orphan run history and name-based lookups.
#
# ROUTING (SO condition 1): alert issues carry `data-compliance`; the Orca reminder
#   `data-compliance-alert-bridge` routes every open one to the CL hourly (t/3598#23). The issue
#   assignee alone is NOT the routing — that inbox is what left #10 unread for 5 days.
#
# AUTO-CLOSE ON RECOVERY (SO condition 2): an evaluated run where a leg passes closes that leg's open
#   issue with "recovered at <sha>", so each regression opens a FRESH issue rather than appending to
#   a stale one. Skipped runs (no citation inputs) and a regen-pending leg-c close nothing.
#
# Push range: github.event.before..github.event.after with fetch-depth: 0 (multi-commit safe).
#   Zero-SHA (first/force-push) or workflow_dispatch → full-set validation, not a silent no-op.
#
# Pre-filter: skip unless the push touched summaries/ or taxonomy/Origin/ (POV files, situations.json,
#   source_index.json) — the only inputs legs a+c read. Keeps data-only pushes elsewhere fast.

name: Citation-Link Integrity Check (Warn-First)

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual full-set run (proof / on-demand); classifier-blocked for agents, human-dispatchable

permissions:
  contents: read
  issues: write

jobs:
  citation-link-integrity:
    runs-on: ubuntu-latest
    continue-on-error: false   # leg-a promoted (t/4042, SO e/266). Only leg-a can fail the run — see $failing.
    steps:
      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0  # full history — before-SHA must be reachable for the push-range diff

      - name: Checkout code repo (AITriad module)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          repository: jpsnover/ai-triad-research   # public — no token needed
          path: ai-triad-research
          fetch-depth: 1

      - name: Check if citation inputs changed
        id: inputcheck
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — full-set validation"
            echo "inputs_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          ZERO="0000000000000000000000000000000000000000"
          # t/3895: is a source_index regen PENDING for this push? Defined to be true EXACTLY when
          # source-index-regen.yml regenerates for this push (CL review, PR #15: neutral <=> regen
          # runs) -- same REGEN_INPUTS diff, same zero-SHA and diff-failure fallbacks (both regen
          # full-set there). That workflow then evaluates leg-c on the fresh index ("Post-regen
          # leg-c") and alerts on red OR could-not-evaluate, so leg-c reported NEUTRAL here is
          # never unobserved: its authoritative verdict is that step.
          # REGEN_INPUTS -- keep IDENTICAL to the list in source-index-regen.yml.
          REGEN_INPUTS="summaries/ taxonomy/Origin/accelerationist.json taxonomy/Origin/safetyist.json taxonomy/Origin/skeptic.json"
          if [ "$BEFORE" = "$ZERO" ]; then
            echo "Zero-SHA push (first/force-push) — full-set validation; regen also runs full-set"
            echo "inputs_changed=true" >> "$GITHUB_OUTPUT"
            echo "regen_pending=true" >> "$GITHUB_OUTPUT"
          else
            # shellcheck disable=SC2086 -- REGEN_INPUTS is a deliberate word-split pathspec list
            if ! RDIFF=$(git diff --name-only "$BEFORE..$AFTER" -- $REGEN_INPUTS 2>&1); then
              # Mirrors the regen's fallback: a diff failure there means a FULL-SET regen, so a
              # post-regen leg-c (with its alerts) will run -> pending here too.
              echo "::warning::regen-pending check: git diff failed ($RDIFF); regen falls back to full-set, leg-c refresh-pending"
              echo "regen_pending=true" >> "$GITHUB_OUTPUT"
            elif [ -n "$RDIFF" ]; then
              echo "regen inputs changed — regen runs; leg-c here is refresh-pending (t/3895)"
              echo "regen_pending=true" >> "$GITHUB_OUTPUT"
            else
              echo "regen_pending=false" >> "$GITHUB_OUTPUT"
            fi
            # legs a+c read summaries/ and taxonomy/Origin/ (POV files, situations.json, source_index.json)
            DIFF=$(git diff --name-only "$BEFORE..$AFTER" -- 'summaries/' 'taxonomy/Origin/' 2>/dev/null)
            if [ -n "$DIFF" ]; then
              echo "citation inputs in push range — running check"
              echo "inputs_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "no citation inputs in push range — skipping"
              echo "inputs_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install Pester
        if: steps.inputcheck.outputs.inputs_changed == 'true'
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser

      - name: Run citation-link integrity check (a+c; leg-b skipped pending sources token)
        id: citation_check
        if: steps.inputcheck.outputs.inputs_changed == 'true'
        shell: pwsh
        env:
          AI_TRIAD_DATA_ROOT: ${{ github.workspace }}   # data dirs resolve from the checked-out repo (bdi precedent)
          REGEN_PENDING: ${{ steps.inputcheck.outputs.regen_pending }}
        run: |
          Import-Module ./ai-triad-research/scripts/AITriad/AITriad.psm1 -Force -WarningAction SilentlyContinue

          # -SkipSourceResolution: leg-b reports `skipped`/pass, never resolves ai-triad-sources
          # (that repo is private + not checked out here yet — t/3745#4). legs a+c run normally.
          $r = Test-CitationLinkIntegrity -SkipSourceResolution

          # t/3895: when a regen is pending, leg-c's verdict HERE is about an index that is being
          # rebuilt right now -- report it NEUTRAL and leave it out of this run's pass/fail. The
          # authoritative leg-c verdict for this push is the "Post-regen leg-c" step in
          # source-index-regen.yml. A NON-pending push (no regen input changed, or the push
          # carried its own index) still evaluates leg-c normally.
          $regenPending = ($env:REGEN_PENDING -eq 'true')
          foreach ($leg in $r.results) {
            $n = @($leg.offenders).Count
            if ($leg.leg -eq 'b') {
              Write-Host "leg (b) source-resolution: SKIPPED (sources token not yet provisioned here — t/3745)"
            } elseif ($leg.leg -eq 'c' -and $regenPending) {
              Write-Host "leg (c) $($leg.name): REFRESH-PENDING (neutral; pre-regen pass=$($leg.pass) offenders=$n) -- authoritative verdict is source-index-regen.yml 'Post-regen leg-c' (t/3895)"
            } else {
              Write-Host "leg ($($leg.leg)) $($leg.name): pass=$($leg.pass) offenders=$n"
            }
          }

          # Per-leg state for the alert / auto-close steps: pass | fail | pending (leg-c only).
          # A leg the cmdlet did not return is left unset, so nothing auto-closes on it. `lega` is
          # written only AFTER the absent/floor guards below, so a not-evaluated run can never
          # auto-close an open leg-a issue as "recovered".
          foreach ($leg in @($r.results | Where-Object { $_.leg -eq 'c' })) {
            $state = if ($leg.leg -eq 'c' -and $regenPending) { 'pending' } elseif ($leg.pass) { 'pass' } else { 'fail' }
            "leg$($leg.leg)=$state" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

          # Every non-neutral failing leg is reported; ONLY leg-a fails the run (t/4042).
          $reported = @($r.results | Where-Object { -not $_.pass -and -not ($_.leg -eq 'c' -and $regenPending) })
          foreach ($leg in $reported) {
            $sample = @($leg.offenders | Select-Object -First 5 | ForEach-Object { $_ | ConvertTo-Json -Compress -Depth 4 }) -join '; '
            $kind = if ($leg.leg -eq 'a') { 'error' } else { 'warning' }
            Write-Host "::$kind::Citation-integrity leg ($($leg.leg)) $($leg.name): $(@($leg.offenders).Count) offender(s) — $sample"
          }
          # Fail CLOSED: a leg-a absent from the results (refactor, filter, early return) is not a pass.
          # `lega` stays unset, so the alert's "could not be evaluated" branch fires (CL, PR #29).
          if (-not @($r.results | Where-Object { $_.leg -eq 'a' })) {
            Write-Host "::error::Citation-link integrity: leg-a was not evaluated (absent from results) — not a pass"
            exit 1
          }
          # Fail CLOSED below a coverage floor: leg-a present with pass=True after examining ~nothing
          # (moved summaries dir, checkout-path change, empty sparse checkout) is not a pass (SO e/266#10).
          # FLOOR = 50% of the 2026-10-07 corpus at data 02c0c2c9: 870 summaries, 16,685 node refs
          # (11,424 key-point + 5,261 claim; CL count, DevOps cross-check 16,676 — within noise).
          # 50% tolerates ordinary removals/re-splits while any narrowed or empty glob falls far below.
          # Absent count fields (cmdlet predating them) also fail closed. Stipulated threshold —
          # registered in CL's provenance register; re-baseline there, not here, if the corpus shrinks.
          $legA = @($r.results | Where-Object { $_.leg -eq 'a' })[0]
          $floorSummaries = 400; $floorRefs = 8000
          $scanned = $legA.PSObject.Properties['summariesScanned']; $refs = $legA.PSObject.Properties['refsChecked']
          if (-not $scanned -or -not $refs -or [int]$scanned.Value -lt $floorSummaries -or [int]$refs.Value -lt $floorRefs) {
            Write-Host "::error::Citation-link integrity: leg-a evaluated below floor (summariesScanned=$(if ($scanned) { $scanned.Value } else { 'absent' }) / $floorSummaries, refsChecked=$(if ($refs) { $refs.Value } else { 'absent' }) / $floorRefs) — not a pass"
            exit 1
          }
          Write-Host "leg (a) coverage: summariesScanned=$($scanned.Value) refsChecked=$($refs.Value) (floor $floorSummaries / $floorRefs)"
          "lega=$(if ($legA.pass) { 'pass' } else { 'fail' })" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $failing = @($reported | Where-Object { $_.leg -eq 'a' })
          if ($failing.Count -gt 0) {
            Write-Host "Citation-link integrity: leg-a FAILED (blocking, t/4042)."
            exit 1
          } else {
            Write-Host "Citation-link integrity: leg-a passed$(if ($reported.Count) { '; advisory leg(s) reported above' })."
          }

      # Exact-title lookup of an OPEN data-compliance issue. `gh --search` also matches bodies (the
      # post-regen leg-c issues mention "citation"), so the search only narrows; jq picks the title.
      # A failed lookup prints a WARN and returns "" — the alert then creates a fresh issue (louder,
      # never silent) and auto-close closes nothing (never a wrong close).
      - name: Alert — leg-a offender (blocking) or check could not be evaluated
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGA: ${{ steps.citation_check.outputs.lega }}
        run: |
          PUSH_SHA="${{ github.event.after || github.sha }}"
          ACTOR="${{ github.actor }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="Data: citation-link integrity offender(s) on push"
          if [ "$LEGA" = "fail" ]; then
            WHAT="introduced a citation-link **leg-a** (summary→node link resolution) offender. This run is RED."
            ACTION="See the run log's \`::error::\` line for the offending summary/node ids, repair the data, then push. The next passing run closes this issue automatically."
          else
            WHAT="could NOT be evaluated (the check step failed before reporting leg-a). This is not a pass."
            ACTION="Open the run log, fix the check (module import, checkout, cmdlet error), and re-run."
          fi
          BODY="Push ${PUSH_SHA:0:8} by ${ACTOR} ${WHAT}

          **Action:** ${ACTION}

          Run: ${RUN_URL}

          Routing: the \`data-compliance-alert-bridge\` Orca reminder routes this issue to the CL (t/3598#23). Gate: t/4042 (leg-a promoted, SO e/266)."

          gh label create "data-compliance" --color "#e4e669" \
            --description "Data corpus compliance regression" 2>/dev/null || true

          if ! LIST=$(gh issue list --label "data-compliance" --state open --search "citation-link integrity in:title" --json number,title); then
            echo "::warning::issue lookup failed — creating a fresh issue rather than risk a silent alert"
            LIST="[]"
          fi
          EXISTING=$(echo "$LIST" | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty')

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "data-compliance" --assignee jpsnover
          fi

      - name: Alert — leg-c staleness (advisory; run stays green)
        if: always() && steps.citation_check.outputs.legc == 'fail'
        continue-on-error: true   # advisory alert — a gh hiccup here must not turn the run red
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PUSH_SHA="${{ github.event.after || github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="Data: source_index staleness (citation leg-c, advisory) on push"
          BODY="Push ${PUSH_SHA:0:8} left \`source_index.json\` stale (leg-c: stale-hash / dead-key / missing-key). No regen was pending for this push, so the post-regen check will not cover it. **Advisory**: leg-c is not promoted; this run stays green.

          **Action:** see the run log's leg-c \`::warning::\` line; regenerate the index (\`source-index-regen.yml\`, workflow_dispatch) or repair it. The next run where leg-c passes closes this issue automatically.

          Run: ${RUN_URL}"
          gh label create "data-compliance" --color "#e4e669" \
            --description "Data corpus compliance regression" 2>/dev/null || true
          if ! LIST=$(gh issue list --label "data-compliance" --state open --search "source_index staleness in:title" --json number,title); then
            echo "::warning::issue lookup failed — creating a fresh issue rather than risk a silent alert"
            LIST="[]"
          fi
          EXISTING=$(echo "$LIST" | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "data-compliance" --assignee jpsnover
          fi

      - name: Auto-close on recovery (SO e/266 condition 2)
        if: always() && (steps.citation_check.outputs.lega == 'pass' || steps.citation_check.outputs.legc == 'pass')
        continue-on-error: true   # housekeeping — a failed close leaves a stale issue, never a red run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGA: ${{ steps.citation_check.outputs.lega }}
          LEGC: ${{ steps.citation_check.outputs.legc }}
        run: |
          SHA="${{ github.event.after || github.sha }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          close_recovered() {  # $1 = exact title, $2 = search narrowing, $3 = leg label
            if ! LIST=$(gh issue list --label "data-compliance" --state open --search "$2 in:title" --json number,title); then
              echo "::warning::auto-close: issue lookup failed for '$1' — nothing closed (a stale open issue is the safe failure)"
              return 0
            fi
            for N in $(echo "$LIST" | jq -r --arg t "$1" '.[] | select(.title == $t) | .number'); do
              gh issue close "$N" --reason completed --comment "Recovered at ${SHA:0:8}: $3 passed on this push (${RUN_URL}). Closed automatically so the next regression opens a fresh issue (t/4042)."
              echo "closed #$N ($3 recovered at ${SHA:0:8})"
            done
          }
          [ "$LEGA" = "pass" ] && close_recovered "Data: citation-link integrity offender(s) on push" "citation-link integrity" "leg-a"
          [ "$LEGC" = "pass" ] && close_recovered "Data: source_index staleness (citation leg-c, advisory) on push" "source_index staleness" "leg-c"
          exit 0
