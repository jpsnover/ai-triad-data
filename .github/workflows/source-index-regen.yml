# ─── Source Index Regeneration (t/3788) ───
# What:  Fires on every push to main that touches summaries/ OR a POV node file
#        (accelerationist/safetyist/skeptic.json -- t/3895). Rebuilds
#        taxonomy/Origin/source_index.json via the canonical Build-NodeSourceIndex
#        cmdlet and commits it back, keeping the belief-node → primary-source index
#        from silently drifting behind the harvester's summary writes (the bug this
#        ticket exists to close — summaries land routinely, the index never rebuilt).
#
# LOCKED BUILD SPEC: t/3788#4 (DevOps Lead, consolidating TL t/3788#2 + CL t/3788#3).
# Numbered references below map to that spec's 8 points.
#
# [1] TRIGGER + LOOP-GUARD: triggers on push to main like the two sibling workflows
#     (bdi-boundary-check.yml, citation-link-integrity.yml), then an in-job before/after
#     diff decides whether summaries/ was touched — same pattern as those two, chosen
#     for consistency AND because it is what correctly handles the zero-SHA
#     (first-push/force-push) edge case as a full-set regen rather than a silent
#     trigger-level `paths:` no-op. The scope is summaries/ PLUS the three POV node
#     files leg-c's key count reads (t/3895 defect 2: a node-only push, e.g. 7fee2c54
#     +9 nodes, left the key count stale) -- and explicitly NOT source_index.json, so
#     this workflow's OWN regen commit (which touches only source_index.json) could
#     never re-trigger itself even if it did start runs (it doesn't -- see [3]).
#
# [3] ORDERING (CL, load-bearing) -- REVISED by t/3895. The original mechanism relied on
#     this workflow's regen commit re-triggering citation-link-integrity.yml so leg-c
#     would evaluate the post-regen index. THAT NEVER HAPPENS: the commit-back is pushed
#     with GITHUB_TOKEN, and GitHub starts NO workflow runs for GITHUB_TOKEN pushes
#     (verified: regen commits 8290eb61 / 53e075ab have 0 runs of any kind). So leg-c
#     was never evaluated on a fresh index. New mechanism: leg-c is evaluated HERE,
#     in-job, right after the regen (step "Post-regen leg-c"), against the exact tree
#     that was committed -- independent of any re-trigger. citation-link-integrity.yml
#     reports its own pre-regen leg-c as NEUTRAL ("refresh pending") exactly when THIS
#     workflow regenerates (CL review, PR #15: neutral <=> regen runs), so the expected
#     mid-refresh state is not a red. That neutral is never unobserved: the post-regen
#     step alerts on red AND on could-not-evaluate (two distinct issues). Both sides key
#     off the SAME input set -- keep REGEN_INPUTS in sync between the two files.
#
# [4] STALENESS WINDOW: bounded by one regen-workflow run (minutes), from the
#     harvester's summary push to this workflow's commit landing. During that window
#     leg-c legitimately reds (the index has not caught up yet) — expected and
#     tolerated because leg-c is advisory-only (see [5]).
#
# [5] leg-c STAYS ADVISORY: untouched by this change. citation-link-integrity.yml's
#     continue-on-error:true is not modified here. Promotion to blocking is a
#     separate, later track (mandatory SO + TL-GV) per CL (t/3788#3), gated on this
#     regen loop running green through several real harvests first.
#
# [6] REGEN-FAILURE OBSERVABILITY (TL's top condition): ai-triad-data is direct-commit,
#     so nothing gates on this workflow — a silent regen failure reproduces the exact
#     bug this ticket closes, one layer down ("no trigger" -> "the trigger failed",
#     equally invisible). On failure, raise a durable, idempotent GitHub issue —
#     the SAME alert pattern already used by bdi-boundary-check.yml and
#     citation-link-integrity.yml, label data-compliance, distinct search string so
#     it doesn't collide with those two.
#
# [7] CANONICAL Build-NodeSourceIndex: invoked via cross-repo checkout of
#     ai-triad-research (public, no token) + Import-Module AITriad — identical
#     cross-repo pattern to both sibling workflows. No second implementation.
#
# [8] FALLBACK (NOT lockstep-in-the-harvester, per TL): if push-triggering from this
#     repo ever proves unreliable, the documented next step is an app-initiated
#     repository_dispatch / workflow_run from the harvester announcing the write,
#     not pwsh in the Electron save path. Not implemented here — only if [1] fails
#     in practice.
#
# COMMIT-BACK PERMISSIONS: same-repo write (this workflow lives in, and commits to,
# ai-triad-data itself) — needs only `permissions: contents: write` below with the
# default GITHUB_TOKEN. This is NOT the cross-repo case cluster-conflicts.yml (in
# ai-triad-research) handles with DATA_REPO_TOKEN; no new secret is provisioned or
# required for this workflow.

name: Source Index Regeneration

on:
  push:
    branches: [main]
  workflow_dispatch:   # manual full-set regen; classifier-blocked for agents, human-dispatchable

permissions:
  contents: write
  issues: write

concurrency:
  group: source-index-regen   # [2] single shared group — queue, never cancel
  cancel-in-progress: false   # [2] a cancelled regen leaves the index stale until the NEXT harvest

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0  # full history — before-SHA must be reachable for the push-range diff

      - name: Checkout code repo (AITriad module)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          repository: jpsnover/ai-triad-research   # public — no token needed
          path: ai-triad-research
          fetch-depth: 1

      - name: Check if regen inputs changed (summaries/ or POV node files)
        id: inputcheck
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch — full-set regen"
            echo "inputs_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          ZERO="0000000000000000000000000000000000000000"
          # t/4064: REGEN_INPUTS is the shared-source read via the ONE parser both workflows call
          # (.github/scripts/read-regen-inputs.sh, owns the format and every fail-closed check) --
          # neither workflow parses .github/regen-inputs.txt inline, so a reintroduced literal
          # shows up in review as dead code. NOT source_index.json (the loop-guard) and NOT
          # situations.json (leg-c doesn't count it) -- enforced by the file's own contents, not
          # this workflow.
          REGEN_INPUTS="$(bash .github/scripts/read-regen-inputs.sh)" || exit 1
          if [ "$BEFORE" = "$ZERO" ]; then
            echo "Zero-SHA push (first/force-push) — full-set regen"
            echo "inputs_changed=true" >> "$GITHUB_OUTPUT"
          else
            # [1] REGEN_INPUTS only — never source_index.json, so this workflow's own
            # index-only regen commit cannot re-trigger itself (the loop-guard).
            #
            # FAIL-SAFE, not fail-open (TL review, PR #11): BEFORE can be a non-zero
            # SHA that is still UNREACHABLE (e.g. after a force-push/history-rewrite).
            # `git diff` then fails, and a naive `2>/dev/null` would make the failure
            # indistinguishable from "ran clean, found nothing" -- silently skipping a
            # regen that was actually needed, which is this ticket's bug one layer
            # down, wearing a success message. So the exit status is checked
            # EXPLICITLY, not inferred from empty output, and a diff failure falls
            # back to a full-set regen with a durable WARN (root AGENTS.md
            # Fallback-Path Logging: log that a fallback was taken, and why).
            #
            # t/4064 condition 3: editing the shared input-set file itself is a regen input --
            # the next regen must run full-set. Checked BEFORE the ordinary REGEN_INPUTS diff
            # (which reads the file's CONTENTS, not whether its definition just changed), and
            # orthogonal to the loop-guard above: a source_index.json-ONLY push matches neither
            # this check nor REGEN_INPUTS, so the guard is untouched.
            RIDEF_DIFF=$(git diff --name-only "$BEFORE..$AFTER" -- .github/regen-inputs.txt 2>/dev/null || true)
            # shellcheck disable=SC2086 -- REGEN_INPUTS is a deliberate word-split pathspec list
            if [ -n "$RIDEF_DIFF" ]; then
              echo "regen-inputs.txt itself changed — forcing full-set regen (t/4064 condition 3)"
              echo "inputs_changed=true" >> "$GITHUB_OUTPUT"
            elif ! DIFF=$(git diff --name-only "$BEFORE..$AFTER" -- $REGEN_INPUTS 2>&1); then
              echo "::warning::git diff $BEFORE..$AFTER failed (BEFORE SHA likely unreachable -- force-push or history rewrite). FALLBACK: full-set regen rather than silently skipping. git output: $DIFF"
              echo "inputs_changed=true" >> "$GITHUB_OUTPUT"
            elif [ -n "$DIFF" ]; then
              echo "regen inputs in push range — regenerating index:"
              echo "$DIFF" | sed 's/^/  /' | head -20
              echo "inputs_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "no regen-input change in push range — skipping"
              echo "inputs_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Regenerate source_index.json
        id: regen
        if: steps.inputcheck.outputs.inputs_changed == 'true'
        shell: pwsh
        env:
          AI_TRIAD_DATA_ROOT: ${{ github.workspace }}
        run: |
          # TL review, PR #11: without $ErrorActionPreference='Stop', a NON-terminating
          # error from Build-NodeSourceIndex leaves this step at exit 0 having written
          # nothing -- indistinguishable, from the commit step onward, from a legitimate
          # no-op regen. That is exactly the failure class [6] exists to prevent, one
          # layer down. Stop converts any non-terminating error into a terminating one.
          $ErrorActionPreference = 'Stop'
          Import-Module ./ai-triad-research/scripts/AITriad/AITriad.psm1 -Force -WarningAction SilentlyContinue

          # [7] the canonical regenerator — no second implementation.
          $ix = Build-NodeSourceIndex -PassThru

          # Assert the postcondition rather than inferring it from the step's exit code
          # (TL review): confirm the file landed where the commit step expects it, and
          # that what's on disk matches what the builder just computed in-memory. This
          # is the second, independent check beyond EAP=Stop -- it catches a write that
          # silently landed somewhere else or was truncated, not just a thrown error.
          $indexPath = 'taxonomy/Origin/source_index.json'
          if (-not (Test-Path -LiteralPath $indexPath)) {
            throw "Postcondition failed: Build-NodeSourceIndex returned but $indexPath does not exist (t/3788)."
          }
          $onDisk = Get-Content -Raw -LiteralPath $indexPath | ConvertFrom-Json
          if ($onDisk.inputHash -ne $ix.inputHash) {
            throw "Postcondition failed: on-disk inputHash ($($onDisk.inputHash)) != builder-returned inputHash ($($ix.inputHash)) -- inconsistent write (t/3788)."
          }
          Write-Host "Postcondition verified: $indexPath written, inputHash=$($ix.inputHash.Substring(0,12))..."

      - name: Commit regenerated index
        id: commit
        if: steps.inputcheck.outputs.inputs_changed == 'true' && steps.regen.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/jpsnover/ai-triad-data.git"
          git add taxonomy/Origin/source_index.json
          if git diff --cached --quiet; then
            echo "No index change to commit (byte-identical regen — t/3598 determinism)"
          else
            git commit -m "chore: regenerate source_index.json (t/3788)"
            # Push with rebase-and-retry. A push to main landing mid-run used to reject this
            # commit-back as non-fast-forward, with no retry, stranding a stale index
            # (run 37679003670, data #49/#54). Rebasing our single index commit onto the
            # newer main is correct: if the intervening commits changed regen inputs, they
            # triggered their own push run, which is queued behind this one (the
            # concurrency group never cancels) and regenerates again. A rebase CONFLICT means
            # someone else committed source_index.json, so stop loudly rather than overwrite.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then pushed=true; break; fi
              echo "::warning::commit-back push rejected (attempt $attempt/5) -- main moved mid-run; rebasing onto origin/main and retrying"
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::commit-back rebase CONFLICT on taxonomy/Origin/source_index.json -- another commit changed the index concurrently; not overwriting it. Re-dispatch source-index-regen after main settles."
                exit 1
              fi
              sleep $((attempt * 5))
            done
            if [ "$pushed" != true ]; then
              echo "::error::commit-back push still rejected after 5 rebase-and-retry attempts -- index NOT published; re-dispatch source-index-regen"
              exit 1
            fi
          fi

      - name: Post-regen leg-c (staleness on the FRESH index — t/3895)
        # [3] REVISED: the only place leg-c is evaluated against a just-regenerated index.
        # Runs on the exact tree the commit step pushed (byte-identical regen included).
        # ADVISORY like leg-c everywhere else: continue-on-error, so a red here annotates and
        # reds this STEP but never trips the regen-failure alert below (failure() stays false) --
        # a stale index after a successful regen is a different signal from "the regen broke".
        # The POST-REGEN line is the evidence CL's leg-c bar reads (t/3895: >=3 real harvests,
        # every regen-input push followed by a green post-regen leg-c).
        # NOT SILENT (CL review, PR #15): continue-on-error keeps the regen alert honest, so the
        # NEXT step raises its own alert on this step's failure. Output `verdict` discriminates:
        # green | red (a real post-regen staleness) | absent (could not evaluate).
        id: postregen_legc
        if: steps.commit.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          AI_TRIAD_DATA_ROOT: ${{ github.workspace }}
        run: |
          # Pester installed INSIDE this advisory step (same module environment as
          # citation-link-integrity.yml): as its own step, an install failure would trip
          # failure() and fire the regen-failure alert for a regen that succeeded.
          Install-Module Pester -Force -Scope CurrentUser
          Import-Module ./ai-triad-research/scripts/AITriad/AITriad.psm1 -Force -WarningAction SilentlyContinue
          $r = Test-CitationLinkIntegrity -SkipSourceResolution
          $c = @($r.results | Where-Object { $_.leg -eq 'c' })[0]
          if (-not $c) { Write-Host "::error::POST-REGEN leg (c): no leg-c result returned -- cannot verify (t/3895)"; exit 1 }
          $n = @($c.offenders).Count
          Write-Host "POST-REGEN leg (c) staleness: pass=$($c.pass) offenders=$n head=$(git rev-parse --short HEAD)"
          "### Post-regen leg-c (t/3895)`n`npass=**$($c.pass)**, offenders=$n, head ``$(git rev-parse --short HEAD)``" |
            Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY
          if (-not $c.pass) {
            $detail = @($c.offenders | ForEach-Object { $_ | ConvertTo-Json -Compress -Depth 4 }) -join '; '
            "verdict=red" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
            "detail=$detail" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
            Write-Host "::warning::POST-REGEN leg-c is RED on a freshly regenerated index -- a real staleness defect, not a mid-refresh state: $detail"
            exit 1
          }
          "verdict=green" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: Alert — idempotent issue on post-regen leg-c red / not evaluated
        # Two DISTINCT records (CL review, PR #15) -- "the fresh index is stale" and "we could not
        # tell" must not look alike:
        #   verdict == 'red'  -> real staleness after a successful regen
        #   anything else    -> the post-regen check failed WITHOUT a verdict (install/import/
        #                       cmdlet error): nothing was verified for this push
        id: postregen_alert
        if: always() && steps.postregen_legc.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ steps.postregen_legc.outputs.verdict }}
          DETAIL: ${{ steps.postregen_legc.outputs.detail }}
        run: |
          PUSH_SHA="${{ github.event.after }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$VERDICT" = "red" ]; then
            TITLE="Data: source_index stale AFTER regen (post-regen leg-c red)"
            SEARCH="source_index stale AFTER regen"
            BODY="Push ${PUSH_SHA:0:8}: source_index.json was regenerated and committed, yet leg-c (staleness) is still RED on the fresh index -- a real defect in the regen or the leg-c inputs, not a mid-refresh state.

          Offenders: ${DETAIL}

          Run: ${RUN_URL}

          Post-regen leg-c: t/3895."
          else
            TITLE="Data: post-regen leg-c could NOT be evaluated"
            SEARCH="post-regen leg-c could NOT be evaluated"
            BODY="Push ${PUSH_SHA:0:8}: the index was regenerated, but the post-regen leg-c check failed without a verdict (Pester install, module import or cmdlet error). Leg-c for this push is UNVERIFIED -- treat as unknown, not green.

          Run: ${RUN_URL}

          Post-regen leg-c: t/3895."
          fi

          gh label create "data-compliance" --color "#e4e669" \
            --description "Data corpus compliance regression" 2>/dev/null || true

          EXISTING=$(gh issue list --label "data-compliance" --state open \
            --search "$SEARCH" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "data-compliance" --assignee jpsnover
          fi

      - name: Alert — idempotent issue on regen failure
        # Not when the only failure is the post-regen ALERT step itself (that would mislabel a
        # successful regen as failed); that failure still reds the run.
        if: failure() && steps.postregen_alert.outcome != 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # t/4064 (p/648#106): on workflow_dispatch, github.event.after is EMPTY and there's no
          # branch to show -- a probe/manual run then reads as an unqualified "push by X failed"
          # on main, indistinguishable from a real production alert. github.sha is always
          # populated (it's the commit the run actually checked out), and ref_name/event_name
          # disambiguate dispatch and non-main runs explicitly rather than leaving a blank.
          PUSH_SHA="${{ github.event.after || github.sha }}"
          ACTOR="${{ github.actor }}"
          REF_NAME="${{ github.ref_name }}"
          EVENT_NAME="${{ github.event_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PREFIX=""
          if [ "$REF_NAME" != "main" ]; then
            PREFIX="[non-main: ${REF_NAME}] "
          fi

          TITLE="${PREFIX}Data: source_index.json regeneration failed"
          BODY="${PREFIX}Push ${PUSH_SHA:0:8} by ${ACTOR} (ref: ${REF_NAME}, event: ${EVENT_NAME}) added summaries, but Build-NodeSourceIndex
          regeneration or the commit-back failed. **source_index.json is now stale with NO
          detector other than leg-c (advisory) catching it on the next citation-integrity run.**

          **Action:** See the run log for the failure, fix the underlying issue (module import,
          cmdlet error, or push rejection), then re-run this workflow (workflow_dispatch) to
          catch the index back up.

          Run: ${RUN_URL}

          Push-triggered regen loop: t/3788."

          gh label create "data-compliance" --color "#e4e669" \
            --description "Data corpus compliance regression" 2>/dev/null || true

          EXISTING=$(gh issue list --label "data-compliance" --state open \
            --search "source_index.json regeneration failed" \
            --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            gh issue reopen "$EXISTING" 2>/dev/null || true
          else
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "data-compliance" \
              --assignee jpsnover
          fi
